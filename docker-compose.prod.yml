version: '3.8'

services:
  app-blue:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: callcare-blue
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped

  app-green:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: callcare-green
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped