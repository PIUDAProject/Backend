spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: callcare
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000
  refresh-expiration-ms: 1209600000
  issuer: "callcare"

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI}
  ocr:
    invoke-url: ${NAVER_OCR_INVOKE_URL}
    secret-key: ${NAVER_OCR_SECRET_KEY}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # gpt-4o: 실측상 gpt-4o-mini는 제형 접미사·괄호를 제대로 못 떼고 약을 누락함
  model: ${OPENAI_MODEL:gpt-4o}

coolsms:
  api-key: ${COOLSMS_API_KEY:}
  api-secret: ${COOLSMS_API_SECRET:}
  sender: ${COOLSMS_SENDER_NUMBER:}
  mock-enabled: ${COOLSMS_MOCK_ENABLED:false}

notification:
  delayed-queue:
    poller-enabled: ${NOTIFICATION_DELAYED_QUEUE_POLLER_ENABLED:true}
    poll-interval-ms: ${NOTIFICATION_DELAYED_QUEUE_POLL_INTERVAL_MS:1000}

hira:
  service-key: ${HIRA_SERVICE_KEY:}
  hospital:
    base-url: ${HIRA_HOSPITAL_BASE_URL:https://apis.data.go.kr/B551182/hospInfoServicev2/getHospBasisList}

fcm:
  service-account-key-path: ${FCM_SERVICE_ACCOUNT_KEY_PATH:}
