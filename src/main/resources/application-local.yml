spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]

  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  elasticsearch:
    uris: ${LOCAL_ES_URI}

management:
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
    reactiveelasticsearch:
      enabled: false