version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: callcare-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: callcare
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: